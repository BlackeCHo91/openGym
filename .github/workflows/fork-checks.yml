name: Fork checks

# The fork's own code (FORK.md): the Lifestyle API and its pure helpers. Quick, on every push.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API (lifestyle + route table)
        working-directory: api
        run: node --test test/lifestyle.test.js test/openapi-routes.test.js
      - name: Frontend fork tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx vitest run src/fork
      - name: Frontend builds
        working-directory: frontend
        run: npm run build
